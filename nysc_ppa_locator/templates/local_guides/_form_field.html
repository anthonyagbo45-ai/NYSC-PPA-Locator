<div>
    {{ field.errors }}
    {% if field.name == 'amenities' %}<fieldset><legend>{{ field.label }}</legend>{{ field }}</fieldset>{% else %}{{ field.label_tag }}{{ field }}{% endif %}
    {% if field.help_text %}<p class="field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
