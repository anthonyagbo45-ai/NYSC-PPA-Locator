<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYSC PPA Locator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Webflow-style smooth transitions */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex flex-col min-h-screen">
    <nav class="bg-white border-b border-gray-100 shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-bold text-xl tracking-tight text-emerald-700 flex items-center gap-2">
            <i data-lucide="map-pin"></i> PPA LOCATOR
        </div>
        <div class="hidden md:flex space-x-6 items-center">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="text-gray-600 hover:text-emerald-600 transition">Dashboard</a>
                <a href="{% url 'search_ppa' %}" class="text-gray-600 hover:text-emerald-600 transition">Search PPA</a>
                <a href="{% url 'profile' %}" class="text-gray-600 hover:text-emerald-600 transition">Profile</a>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-gray-600 hover:text-red-600 transition">Logout</button></form>
            {% else %}
                <a href="{% url 'login' %}" class="text-gray-600 hover:text-emerald-600 transition">Login</a>
                <a href="{% url 'register' %}" class="bg-emerald-600 text-white px-5 py-2 rounded-full hover:bg-emerald-700 transition shadow-md">Get Started</a>
            {% endif %}
        </div>
    </nav>
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
