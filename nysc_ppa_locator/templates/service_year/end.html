{% extends 'base.html' %}
{% block title %}Move PPA to history | PPA Locator{% endblock %}
{% block content %}<section class="card section max-w-3xl"><h1>Move PPA to history</h1><h2>{{ assignment.ppa.name }}</h2><form method="post" action="{% url 'end_assignment' assignment.pk %}" class="stack">{% csrf_token %}{{ form.as_p }}<button type="submit">Move to my PPA history</button></form><p><a href="{% url 'assignment_update' assignment.pk %}">Back to my progress</a></p></section>{% endblock %}
