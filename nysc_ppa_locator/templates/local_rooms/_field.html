<div>
    {{ field.errors }}
    {% if field.field.widget.input_type == 'checkbox' %}<label class="checkbox" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>{% else %}{{ field.label_tag }}{{ field }}{% endif %}
    {% if field.help_text %}<p class="field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
</div>
