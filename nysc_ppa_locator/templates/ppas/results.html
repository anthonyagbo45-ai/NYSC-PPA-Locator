{% extends 'base.html' %}
{% block content %}
<div class="max-w-5xl mx-auto p-8">
<h1 class="text-2xl font-bold">PPA search results</h1>
<form method="get" class="my-4"><label for="query">Search by name</label>
<input id="query" name="q" value="{{ query }}" maxlength="200" class="border rounded p-2"><button type="submit">Search</button></form>
<ul class="space-y-4">
{% for ppa in ppas %}
<li class="bg-white p-4 rounded border"><a href="{% url 'ppa_detail' ppa.pk %}">{{ ppa.name }}</a><p>{{ ppa.lga.name }}, {{ ppa.state.name }} — {{ ppa.category }}</p></li>
{% empty %}<li>No matching PPAs.</li>{% endfor %}
</ul>
{% include 'pagination.html' %}
</div>
{% endblock %}
